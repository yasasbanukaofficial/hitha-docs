<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c7ddfc" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2160fd" />
    </marker>
  </defs>

  <rect width="920" height="440" rx="16" fill="#f4f8ff" stroke="#e0ecfd" stroke-width="1.5" />
  <rect width="920" height="440" rx="16" fill="url(#dotGrid)" />

  <!-- PATIENT PAYMENT (Left) -->
  <g transform="translate(48, 80)">
    <rect width="240" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="120" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">PATIENT PAYMENT</text>
    <text x="120" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">PayHere LKR Gateway</text>

    <g transform="translate(20, 100)">
      <rect width="200" height="60" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#475569">Total Consultation Fee</text>
      <text x="100" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#2160fd">LKR 3,500.00</text>
    </g>

    <g transform="translate(20, 180)">
      <rect width="200" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="100" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e40af">MD5 Sig Verification</text>
      <text x="100" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#2563eb">Idempotent Webhook</text>
    </g>
  </g>

  <!-- ESCROW CUSTODY (Center) -->
  <g transform="translate(340, 80)">
    <rect width="240" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="120" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#2160fd">ESCROW CUSTODY</text>
    <text x="120" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">DoctorWalletService</text>

    <g transform="translate(20, 100)">
      <rect width="200" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" />
      <text x="100" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#991b1b">Status: LOCKED</text>
      <text x="100" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#b91c1c">Held during active call</text>
    </g>

    <g transform="translate(20, 180)">
      <rect width="200" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="100" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#166534">Auto-Release Trigger</text>
      <text x="100" y="46" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#15803d">Consultation COMPLETED</text>
    </g>
  </g>

  <!-- LEDGER SPLIT (Right) -->
  <g transform="translate(630, 80)">
    <rect width="240" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="120" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">DOUBLE-ENTRY SPLIT</text>
    <text x="120" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Doctor Wallet &amp; Platform Fee</text>

    <g transform="translate(20, 100)">
      <rect width="200" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#166534">Doctor Withdrawable (80%)</text>
      <text x="100" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#15803d">LKR 2,800.00</text>
    </g>

    <g transform="translate(20, 180)">
      <rect width="200" height="60" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#475569">Platform Commission (20%)</text>
      <text x="100" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#2160fd">LKR 700.00</text>
    </g>
  </g>

  <line x1="288" y1="220" x2="338" y2="220" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <line x1="580" y1="220" x2="628" y2="220" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
</svg>