<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b14" />
      <stop offset="100%" stop-color="#030c09" />
    </linearGradient>
    <linearGradient id="escrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#finBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Step 1: Patient Pays -->
  <rect x="30" y="60" width="180" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="45" y="85" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">1. INITIATION</text>
  <text x="45" y="108" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Patient Consultation</text>
  <text x="45" y="128" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Total Fee: LKR 3,500</text>

  <!-- Arrow -->
  <path d="M 210 105 L 280 105" stroke="#10b981" stroke-width="2" />

  <!-- Step 2: Escrow Lock -->
  <rect x="280" y="45" width="240" height="120" rx="14" fill="url(#escrowGrad)" stroke="#10b981" stroke-width="2"/>
  <rect x="295" y="60" width="85" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="302" y="74" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">ESCROW LOCK</text>
  <text x="295" y="100" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Funds Held in Custody</text>
  <text x="295" y="120" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Doctor cannot withdraw before sign-off</text>
  <text x="295" y="140" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">Escrow Balance: +LKR 3,500</text>

  <!-- Step 3: Doctor signs off & Double Entry Split -->
  <path d="M 400 165 L 400 220" stroke="#10b981" stroke-width="2" />
  
  <rect x="80" y="220" width="300" height="100" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="95" y="245" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DOCTOR WALLET CREDIT (85%)</text>
  <text x="95" y="270" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">LKR 2,975.00 Transferred</text>
  <text x="95" y="295" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Available for weekly bank withdrawal</text>

  <rect x="420" y="220" width="300" height="100" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="435" y="245" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">PLATFORM REVENUE (15%)</text>
  <text x="435" y="270" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">LKR 525.00 Commission</text>
  <text x="435" y="295" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Hitha corporate revenue ledger credited</text>
</svg>
