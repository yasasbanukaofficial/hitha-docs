<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c7ddfc" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2160fd" />
    </marker>
  </defs>

  <rect width="920" height="440" rx="16" fill="#f4f8ff" stroke="#e0ecfd" stroke-width="1.5" />
  <rect width="920" height="440" rx="16" fill="url(#dotGrid)" />

  <!-- SPRING BOOT INGEST (Left) -->
  <g transform="translate(48, 60)">
    <rect width="240" height="320" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <g transform="translate(100, 36)" stroke="#1e293b" stroke-width="2.2" fill="none">
      <rect x="2" y="4" width="36" height="32" rx="4" />
      <line x1="8" y1="14" x2="14" y2="14" />
      <line x1="8" y1="22" x2="24" y2="22" />
    </g>
    <text x="120" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">SPRING BOOT 3.3</text>
    <text x="120" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2160fd">Virtual Threads Engine</text>

    <g transform="translate(20, 165)">
      <rect width="200" height="54" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">CorrelationIdFilter</text>
      <text x="100" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">X-Correlation-Id UUID</text>
    </g>

    <g transform="translate(20, 235)">
      <rect width="200" height="54" rx="8" fill="#2160fd" />
      <text x="100" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Zero-Bloat Routing</text>
    </g>
  </g>

  <!-- PLANE A: LOCAL DISK ROLLING (Top Right) -->
  <g transform="translate(480, 50)">
    <rect width="390" height="155" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">PLANE A: High-Frequency Debug Logs</text>
    <text x="24" y="56" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Local Ephemeral Disk • Rolling SizeAndTimeBasedPolicy</text>

    <g transform="translate(24, 75)">
      <rect width="165" height="55" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="82" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1e293b">100MB / 1 Hour</text>
      <text x="82" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Zipped Gzip Rotation</text>
    </g>

    <g transform="translate(200, 75)">
      <rect width="165" height="55" rx="8" fill="#fef2f2" stroke="#fecaca" />
      <text x="82" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#b91c1c">5GB Cap / 14 Days</text>
      <text x="82" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#991b1b">Automatic Eviction</text>
    </g>
  </g>

  <!-- PLANE B: POSTGRESQL + CLOUDFLARE R2 (Bottom Right) -->
  <g transform="translate(480, 235)">
    <rect width="390" height="155" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">PLANE B: Legal &amp; Audit Trail</text>
    <text x="24" y="56" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Immutable Database Ledger • SHA-256 Hash Chained</text>

    <g transform="translate(24, 75)">
      <rect width="165" height="55" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="82" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">BRIN Index (99% space)</text>
      <text x="82" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#166534">audit_logs(created_at)</text>
    </g>

    <g transform="translate(200, 75)">
      <rect width="165" height="55" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="82" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Cloudflare R2 WORM</text>
      <text x="82" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#2563eb">7-Year Legal Retention</text>
    </g>
  </g>

  <!-- CONNECTING ARROWS -->
  <path d="M 288 180 L 384 180 L 384 125 L 478 125" fill="none" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <circle cx="384" cy="125" r="8" fill="#2160fd" />
  <text x="384" y="128.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">A</text>

  <path d="M 288 240 L 384 240 L 384 310 L 478 310" fill="none" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <circle cx="384" cy="310" r="8" fill="#2160fd" />
  <text x="384" y="313.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">B</text>
</svg>