<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c7ddfc" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2160fd" />
    </marker>
    <marker id="arrowhead-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <!-- Outer Blueprint Container -->
  <rect x="0" y="0" width="920" height="460" rx="16" fill="#f4f8ff" stroke="#e0ecfd" stroke-width="1.5" />
  <rect x="0" y="0" width="920" height="460" rx="16" fill="url(#dotGrid)" />

  <!-- ========================================== -->
  <!-- 1. YOUR BACKEND BOX (Top Left) -->
  <!-- ========================================== -->
  <g transform="translate(48, 48)">
    <rect width="240" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Server Stack Icon -->
    <g transform="translate(100, 38)" stroke="#1e293b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Database / Server Disks -->
      <path d="M 0 10 C 0 3, 40 3, 40 10 C 40 17, 0 17, 0 10 Z" />
      <path d="M 0 10 L 0 24 C 0 31, 40 31, 40 24 L 40 10" />
      <path d="M 0 24 L 0 38 C 0 45, 40 45, 40 38 L 40 24" />
      <line x1="8" y1="20" x2="14" y2="20" />
      <line x1="8" y1="34" x2="14" y2="34" />
    </g>

    <text x="120" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a" letter-spacing="0.05em">YOUR BACKEND</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. YOUR APP BOX (Bottom Left) -->
  <!-- ========================================== -->
  <g transform="translate(48, 276)">
    <rect width="240" height="144" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Phone / Mobile Device Icon -->
    <g transform="translate(68, 20)" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="18" height="26" rx="3" />
      <line x1="7" y1="21" x2="11" y2="21" />
    </g>
    <text x="96" y="38" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="0.05em">YOUR APP</text>

    <!-- Inner Button: Hitha / Dyte SDK -->
    <g transform="translate(20, 62)">
      <rect width="200" height="58" rx="8" fill="#2160fd" />
      <!-- Logo inside button -->
      <g transform="translate(32, 18)" fill="#ffffff">
        <path d="M0 0 L14 0 C20 0 24 5 24 11 C24 17 20 22 14 22 L0 22 Z M5 5 L5 17 L13 17 C16 17 19 15 19 11 C19 7 16 5 13 5 Z" />
      </g>
      <text x="70" y="35" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">HITHA SDK</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. HITHA / DYTE SERVER BOX (Right) -->
  <!-- ========================================== -->
  <g transform="translate(630, 48)">
    <rect width="242" height="372" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Logo Icon / Server Icon in Center Top -->
    <g transform="translate(98, 48)" stroke="#2160fd" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 14 C 0 5, 46 5, 46 14 C 46 23, 0 23, 0 14 Z" fill="#ebf2ff" />
      <path d="M 0 14 L 0 32 C 0 41, 46 41, 46 32 L 46 14" />
      <path d="M 0 32 L 0 50 C 0 59, 46 59, 46 50 L 46 32" />
      <circle cx="10" cy="27" r="2" fill="#2160fd" />
      <circle cx="10" cy="45" r="2" fill="#2160fd" />
    </g>

    <text x="121" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#2160fd" letter-spacing="0.08em">HITHA CORE</text>
    <text x="121" y="166" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b">SFU &amp; REST APIs</text>

    <!-- Bottom Embedded Box inside server card: Persistent connection -->
    <g transform="translate(18, 252)">
      <rect width="206" height="96" rx="10" fill="#f8faff" stroke="#e2eaf8" stroke-width="1" />
      <text x="103" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Persistent connection</text>
      <text x="103" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">established for media and</text>
      <text x="103" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">data transfer</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 4. STEP FLOW ARROWS & LABELS -->
  <!-- ========================================== -->

  <!-- STEP 1: Top Arrow (Backend -> Hitha) -->
  <g>
    <!-- Arrow Line -->
    <line x1="288" y1="84" x2="628" y2="84" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrowhead-blue)" />
    
    <!-- Step Badge (1) -->
    <circle cx="340" cy="84" r="8.5" fill="#2160fd" />
    <text x="340" y="87.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">1</text>
    
    <!-- Label -->
    <text x="356" y="88" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1e293b">Create a meeting using API</text>
  </g>

  <!-- STEP 1 RETURN: Arrow (Hitha -> Backend) -->
  <g>
    <line x1="628" y1="116" x2="290" y2="116" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowhead-dark)" />
    <text x="458" y="112" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#475569">Returns a meeting ID</text>
  </g>

  <!-- STEP 2: Arrow (Backend -> Hitha) -->
  <g>
    <line x1="288" y1="172" x2="628" y2="172" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrowhead-blue)" />
    
    <!-- Step Badge (2) -->
    <circle cx="346" cy="172" r="8.5" fill="#2160fd" />
    <text x="346" y="175.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
    
    <text x="362" y="176" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1e293b">Add participant/s to a meeting</text>
  </g>

  <!-- STEP 2 RETURN: Arrow (Hitha -> Backend) -->
  <g>
    <line x1="628" y1="202" x2="290" y2="202" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowhead-dark)" />
    <text x="458" y="198" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#475569">Returns unique auth token for every participant/s</text>
  </g>

  <!-- STEP 3: Vertical Arrow (Backend Down to App) -->
  <g>
    <line x1="168" y1="228" x2="168" y2="274" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrowhead-blue)" />
    
    <!-- Step 3 pill container -->
    <rect x="134" y="240" width="108" height="22" rx="11" fill="#ffffff" stroke="#e0e7ff" stroke-width="1" />
    <!-- Step Badge (3) -->
    <circle cx="145" cy="251" r="7" fill="#2160fd" />
    <text x="145" y="254" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">3</text>
    <text x="158" y="255" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2160fd">Auth token sent</text>
  </g>

  <!-- STEP 4: Bi-directional Arrow (Client SDK <-> Live Server) -->
  <g>
    <!-- Top line -->
    <line x1="268" y1="360" x2="628" y2="360" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrowhead-blue)" />
    <!-- Bottom line -->
    <line x1="628" y1="374" x2="270" y2="374" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrowhead-blue)" />
    
    <!-- Step 4 Badge & Label -->
    <rect x="340" y="356" width="224" height="24" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="1" />
    <circle cx="354" cy="368" r="8" fill="#2160fd" />
    <text x="354" y="371.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">4</text>
    <text x="370" y="372" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#2160fd">Live Voice &amp; Video Established</text>
  </g>

</svg>
