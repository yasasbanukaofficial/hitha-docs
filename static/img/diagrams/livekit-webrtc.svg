<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="rtcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071526" />
      <stop offset="100%" stop-color="#020912" />
    </linearGradient>
    <linearGradient id="livekitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#rtcBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Patient Box -->
  <rect x="40" y="60" width="180" height="100" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="90" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">PATIENT CLIENT</text>
  <text x="60" y="115" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Flutter Mobile App</text>
  <text x="60" y="135" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Subscribed / On-Demand</text>

  <!-- Doctor Box -->
  <rect x="40" y="200" width="180" height="100" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="230" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DOCTOR CLIENT</text>
  <text x="60" y="255" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Web Portal / App</text>
  <text x="60" y="275" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Active on Redis duty pool</text>

  <!-- LiveKit SFU Center -->
  <rect x="300" y="90" width="230" height="180" rx="16" fill="url(#livekitGrad)" stroke="#38bdf8" stroke-width="2"/>
  <text x="325" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SFU MEDIA ENGINE</text>
  <text x="325" y="152" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">LiveKit Server</text>
  <text x="325" y="175" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">WebRTC Audio/Video Tracks</text>
  <text x="325" y="200" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">E2E Encrypted Room</text>
  
  <rect x="325" y="215" width="180" height="30" rx="6" fill="#0b1b2b" stroke="#38bdf8" stroke-width="1"/>
  <text x="340" y="235" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Mid-Call Extend (+15m/+30m)</text>

  <!-- Audio Video Links -->
  <path d="M 220 110 L 300 140" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
  <path d="M 220 250 L 300 220" stroke="#34d399" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Outbox / Backend sync -->
  <path d="M 530 180 L 590 180" stroke="#94a3b8" stroke-width="2" />
  <rect x="590" y="110" width="170" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="605" y="140" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">BACKEND DISPATCH</text>
  <text x="605" y="165" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Spring Boot 3.3</text>
  <text x="605" y="188" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Quota ledger balance check</text>
  <text x="605" y="206" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Escrow payment custody</text>
  <text x="605" y="226" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Zero-PHI Prescription audit</text>
</svg>
