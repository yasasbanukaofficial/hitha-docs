<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c7ddfc" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2160fd" />
    </marker>
  </defs>

  <rect width="920" height="440" rx="16" fill="#f4f8ff" stroke="#e0ecfd" stroke-width="1.5" />
  <rect width="920" height="440" rx="16" fill="url(#dotGrid)" />

  <!-- CLIENT INCOMING (Left) -->
  <g transform="translate(48, 80)">
    <rect width="220" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <g transform="translate(90, 36)" stroke="#1e293b" stroke-width="2.2" fill="none">
      <circle cx="20" cy="15" r="12" />
      <path d="M 4 40 C 4 28, 36 28, 36 40" />
    </g>
    <text x="110" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">CLIENT REQUESTS</text>
    <text x="110" y="136" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" fill="#64748b">Public, Doctors &amp; Auth</text>

    <g transform="translate(20, 165)">
      <rect width="180" height="75" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="90" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e293b">Bucket4j + Redis</text>
      <text x="90" y="46" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Token Bucket Filter</text>
      <text x="90" y="64" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2160fd">HTTP 429 Too Many Req</text>
    </g>
  </g>

  <!-- 3 RATE TIERS (Right) -->
  <!-- Tier 1: Auth Endpoints -->
  <g transform="translate(360, 50)">
    <rect width="510" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="36" cy="50" r="16" fill="#fef2f2" />
    <text x="36" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#dc2626">1</text>
    <text x="72" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0f172a">Authentication &amp; OTP Endpoints</text>
    <text x="72" y="64" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">/api/v1/auth/login, /api/v1/auth/verify-otp • Strict 5 requests / minute per IP</text>
    <rect x="395" y="32" width="95" height="36" rx="6" fill="#fee2e2" />
    <text x="442" y="54" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#991b1b">5 req / min</text>
  </g>

  <!-- Tier 2: Public Clinical Endpoints -->
  <g transform="translate(360, 170)">
    <rect width="510" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="36" cy="50" r="16" fill="#eff6ff" />
    <text x="36" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#2160fd">2</text>
    <text x="72" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0f172a">Clinical Directory &amp; Slot Search</text>
    <text x="72" y="64" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">/api/v1/doctors, /api/v1/slots/available • 60 requests / minute per IP</text>
    <rect x="395" y="32" width="95" height="36" rx="6" fill="#dbeafe" />
    <text x="442" y="54" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#1e40af">60 req / min</text>
  </g>

  <!-- Tier 3: Authenticated Doctors & Webhooks -->
  <g transform="translate(360, 290)">
    <rect width="510" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="36" cy="50" r="16" fill="#f0fdf4" />
    <text x="36" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#16a34a">3</text>
    <text x="72" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0f172a">Authenticated Doctor Actions &amp; Webhooks</text>
    <text x="72" y="64" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Bearer Token validated sessions &amp; PayHere MD5 webhooks • 300 requests / minute</text>
    <rect x="395" y="32" width="95" height="36" rx="6" fill="#dcfce7" />
    <text x="442" y="54" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#166534">300 req / min</text>
  </g>

  <line x1="268" y1="220" x2="358" y2="100" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <line x1="268" y1="220" x2="358" y2="220" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <line x1="268" y1="220" x2="358" y2="340" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
</svg>