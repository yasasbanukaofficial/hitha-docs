<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#secBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Flow Items -->
  <!-- 1. Inbound Request -->
  <rect x="30" y="130" width="130" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="45" y="160" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">INBOUND</text>
  <text x="45" y="185" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Client HTTP</text>
  <text x="45" y="202" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">IP / Bearer Token</text>

  <!-- Arrow to Filter -->
  <path d="M 160 175 L 210 175" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. RateLimitFilter -->
  <rect x="210" y="80" width="220" height="190" rx="12" fill="url(#bucketGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="230" y="110" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">FILTER LAYER (PRE-AUTH)</text>
  <text x="230" y="135" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Bucket4j Limiter</text>
  
  <rect x="230" y="150" width="180" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="240" y="167" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">Tier 1: Global (300/m)</text>

  <rect x="230" y="184" width="180" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="240" y="201" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">Tier 2: Auth (5/m)</text>

  <rect x="230" y="218" width="180" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="240" y="235" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">Tier 3: PayHere (20/m)</text>

  <text x="230" y="258" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">✓ Drops malicious probes before DB</text>

  <!-- Split into 429 or Allowed -->
  <path d="M 430 140 L 510 90 L 540 90" stroke="#ef4444" stroke-width="2" fill="none" />
  <rect x="540" y="60" width="220" height="65" rx="10" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.2"/>
  <text x="555" y="85" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">HTTP 429 TOO MANY REQUESTS</text>
  <text x="555" y="105" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">HikariCP 0ms overhead • DB untouched</text>

  <path d="M 430 200 L 510 240 L 540 240" stroke="#10b981" stroke-width="2" fill="none" />
  <rect x="540" y="210" width="220" height="85" rx="10" fill="#0c1f1a" stroke="#10b981" stroke-width="1.2"/>
  <text x="555" y="235" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ALLOWED REQUEST</text>
  <text x="555" y="255" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Dispatches to Virtual Thread Worker</text>
  <text x="555" y="275" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Clinical endpoints fail-open safely</text>
</svg>
