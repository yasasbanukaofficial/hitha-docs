<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c7ddfc" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2160fd" />
    </marker>
    <marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <rect width="920" height="440" rx="16" fill="#f4f8ff" stroke="#e0ecfd" stroke-width="1.5" />
  <rect width="920" height="440" rx="16" fill="url(#dotGrid)" />

  <!-- PATIENT CARD (Left) -->
  <g transform="translate(48, 50)">
    <rect width="240" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <g transform="translate(100, 32)" stroke="#2160fd" stroke-width="2.2" fill="none">
      <circle cx="20" cy="15" r="12" />
      <path d="M 4 40 C 4 28, 36 28, 36 40" />
    </g>
    <text x="120" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">PATIENT CLIENT</text>
    <text x="120" y="136" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" fill="#64748b">Flutter Mobile App</text>

    <g transform="translate(20, 165)">
      <rect width="200" height="54" rx="8" fill="#2160fd" />
      <text x="100" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">'Call Now' Action</text>
    </g>

    <g transform="translate(20, 235)">
      <rect width="200" height="80" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e293b">Initial Consultation</text>
      <text x="100" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#2160fd">15m / 30m / 45m</text>
      <text x="100" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Tokenized Quota Lock</text>
    </g>
  </g>

  <!-- DISPATCH ENGINE (Center) -->
  <g transform="translate(340, 50)">
    <rect width="240" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <g transform="translate(100, 32)" stroke="#1e293b" stroke-width="2.2" fill="none">
      <rect x="2" y="4" width="36" height="32" rx="4" />
      <line x1="8" y1="14" x2="14" y2="14" />
      <line x1="8" y1="22" x2="24" y2="22" />
    </g>
    <text x="120" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">DISPATCH ENGINE</text>
    <text x="120" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2160fd">WaitingQueueDispatcher</text>

    <g transform="translate(20, 165)">
      <rect width="200" height="66" rx="8" fill="#fef2f2" stroke="#fecaca" />
      <text x="100" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">Pessimistic Row Lock</text>
      <text x="100" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#991b1b">SELECT ... FOR UPDATE</text>
    </g>

    <g transform="translate(20, 245)">
      <rect width="200" height="70" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">Redis Presence Pool</text>
      <text x="100" y="48" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" fill="#475569">Doctor 'On-Duty' Queue</text>
    </g>
  </g>

  <!-- DOCTOR CARD (Right) -->
  <g transform="translate(632, 50)">
    <rect width="240" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <g transform="translate(100, 32)" stroke="#16a34a" stroke-width="2.2" fill="none">
      <circle cx="20" cy="15" r="12" />
      <path d="M 4 40 C 4 28, 36 28, 36 40" />
      <path d="M 20 22 L 20 34 M 14 28 L 26 28" />
    </g>
    <text x="120" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">DUTY DOCTOR</text>
    <text x="120" y="136" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" fill="#16a34a" font-weight="600">State: RINGING</text>

    <g transform="translate(20, 165)">
      <rect width="200" height="54" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="100" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#15803d">45s Acceptance Window</text>
      <text x="100" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" fill="#166534">Timeout auto-reroutes</text>
    </g>

    <g transform="translate(20, 235)">
      <rect width="200" height="80" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2160fd">Consultation Accepted</text>
      <text x="100" y="54" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" fill="#475569">Spins up LiveKit Room</text>
    </g>
  </g>

  <!-- STEP ARROWS -->
  <line x1="288" y1="140" x2="338" y2="140" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <circle cx="313" cy="140" r="8" fill="#2160fd" />
  <text x="313" y="143.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">1</text>

  <line x1="580" y1="140" x2="630" y2="140" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <circle cx="605" cy="140" r="8" fill="#2160fd" />
  <text x="605" y="143.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">2</text>
</svg>