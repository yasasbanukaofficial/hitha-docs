<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c7ddfc" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2160fd" />
    </marker>
  </defs>

  <rect width="920" height="440" rx="16" fill="#f4f8ff" stroke="#e0ecfd" stroke-width="1.5" />
  <rect width="920" height="440" rx="16" fill="url(#dotGrid)" />

  <!-- POSTGRES HOT TIER (Left) -->
  <g transform="translate(48, 80)">
    <rect width="240" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="120" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">HOT AUDIT TIER</text>
    <text x="120" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">PostgreSQL 16 audit_logs</text>

    <g transform="translate(20, 110)">
      <rect width="200" height="55" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e293b">Retention: 90 Days</text>
      <text x="100" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Active query window</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="200" height="55" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e40af">BRIN Index Scan</text>
      <text x="100" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2563eb">Batch export slice</text>
    </g>
  </g>

  <!-- ARCHIVE PIPELINE (Center) -->
  <g transform="translate(340, 80)">
    <rect width="240" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="120" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#2160fd">ARCHIVE PIPELINE</text>
    <text x="120" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">AuditLogArchiveServiceImpl</text>

    <g transform="translate(20, 110)">
      <rect width="200" height="55" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e293b">GZIP Compression</text>
      <text x="100" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">85% Stream Reduction</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="200" height="55" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#15803d">SHA-256 Manifest</text>
      <text x="100" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#166534">Immutable Hash Digest</text>
    </g>
  </g>

  <!-- CLOUDFLARE R2 COLD STORAGE (Right) -->
  <g transform="translate(630, 80)">
    <rect width="240" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="120" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">CLOUDFLARE R2</text>
    <text x="120" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">WORM Cold Archival</text>

    <g transform="translate(20, 110)">
      <rect width="200" height="55" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e40af">Hive Partitioning</text>
      <text x="100" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2563eb">year=YYYY/month=MM</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="200" height="55" rx="8" fill="#2160fd" />
      <text x="100" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">7-Year Legal Lock</text>
      <text x="100" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#e0e7ff">Object Lock Enabled</text>
    </g>
  </g>

  <line x1="288" y1="220" x2="338" y2="220" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <line x1="580" y1="220" x2="628" y2="220" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
</svg>