<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c7ddfc" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2160fd" />
    </marker>
  </defs>

  <rect width="920" height="440" rx="16" fill="#f4f8ff" stroke="#e0ecfd" stroke-width="1.5" />
  <rect width="920" height="440" rx="16" fill="url(#dotGrid)" />

  <!-- USER (Left) -->
  <g transform="translate(48, 80)">
    <rect width="240" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="120" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">PATIENT SIGNUP</text>
    <text x="120" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Flutter Mobile App</text>

    <g transform="translate(20, 110)">
      <rect width="200" height="55" rx="8" fill="#2160fd" />
      <text x="100" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">POST /api/v1/auth/register</text>
      <text x="100" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#e0e7ff">Phone + Password + Name</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="200" height="55" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e293b">OTP Verification</text>
      <text x="100" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2160fd">TextLK SMS 6-Digit</text>
    </g>
  </g>

  <!-- HITHA CORE (Center) -->
  <g transform="translate(340, 80)">
    <rect width="240" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="120" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#2160fd">AUTH CONTROLLER</text>
    <text x="120" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Spring Security 6 + BCrypt</text>

    <g transform="translate(20, 110)">
      <rect width="200" height="55" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e293b">Password Hashing</text>
      <text x="100" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">BCrypt strength=12</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="200" height="55" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e40af">Audit Event Chain</text>
      <text x="100" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2563eb">USER_REGISTERED</text>
    </g>
  </g>

  <!-- POSTGRESQL (Right) -->
  <g transform="translate(630, 80)">
    <rect width="240" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="120" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">POSTGRESQL 16</text>
    <text x="120" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Relational Storage</text>

    <g transform="translate(20, 110)">
      <rect width="200" height="55" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#15803d">users Table Insert</text>
      <text x="100" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#166534">role=ROLE_PATIENT</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="200" height="55" rx="8" fill="#f8faff" stroke="#e2eaf8" />
      <text x="100" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1e293b">wallets Table Row</text>
      <text x="100" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Initial balance = 0.00</text>
    </g>
  </g>

  <line x1="288" y1="220" x2="338" y2="220" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <line x1="580" y1="220" x2="628" y2="220" stroke="#2160fd" stroke-width="1.8" marker-end="url(#arrow-blue)" />
</svg>